version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attention
      POSTGRES_USER: attention
      POSTGRES_PASSWORD: attention
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attention -d attention"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: user@example.com
      SMTP_PASSWORD: password
      SMTP_SENDER: noreply@example.com
      DATABASE_URL: postgres://attention:attention@postgres:5432/attention
      API_KEY: local-dev-key
    depends_on:
      postgres:
        condition: service_healthy
