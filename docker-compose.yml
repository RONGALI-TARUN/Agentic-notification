version: '3.8'
services:
  go-notification-service:
    build:
      context: ./go-server/notification-service
      dockerfile: Dockerfile
    image: notification-service-go:latest
    ports:
      - "8080:8080"
    environment:
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: user@example.com
      SMTP_PASSWORD: password
      SMTP_SENDER: noreply@example.com

  java-notification-service:
    build:
      context: ./java-server/production
      dockerfile: Dockerfile
    image: notification-service-java:latest
    ports:
      - "8081:8080"
    environment:
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: user@example.com
      SMTP_PASSWORD: password
      SMTP_SENDER: noreply@example.com
